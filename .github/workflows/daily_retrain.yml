name: Daily Model Retraining

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write   # required for the Pages deploy step below

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      # ... all existing steps unchanged (checkout, setup python, install deps,
      # start MLflow, run pipeline, save MLflow artifact) ...

      - name: Save drift report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-report-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: Publish drift report to GitHub Pages
        if: always() && hashFiles('reports/latest_drift_report.html') != ''
        run: |
          mkdir -p public
          cp reports/latest_drift_report.html public/index.html

      - name: Deploy to GitHub Pages
        if: always() && hashFiles('reports/latest_drift_report.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public