model:
  name: "weather-forecast"
  algorithm: "GradientBoostingRegressor"
  params:
    n_estimators: 80       # filled in AFTER notebook experimentation
    max_depth: 3            # filled in AFTER notebook experimentation
    learning_rate: 0.1     # filled in AFTER notebook experimentation
    random_state: 7

data:
  latitude: -33.92           # Cape Town 
  longitude: 18.42
  timezone: "Africa/Johannesburg"
  days_back: 3650
  raw_path: "data/raw/weather.csv"
  processed_path: "data/processed/features.csv"

features:
  target_col: "target"
  feature_cols:
    - temperature_2m_max
    - temperature_2m_min
    - wind_speed_10m_max
    - shortwave_radiation_sum
    - precipitation_sum
    - day_of_year

evaluation:
  mae_threshold: 2.8        # filled in AFTER notebook experimentation ( holdout MAE + buffer of 0.5)
  improvement_pct: 0.05     # new model must beat prod by at least 5%

mlflow:
  experiment_name: "weather-forecast"
  tracking_uri: "http://127.0.0.1:5000"

drift:
  window_days: 30   # size of "current" window; everything older is "reference"
